services:
  # ---------------------------------------------
  # 0. MariaDB Database
  # ---------------------------------------------
  mariadb:
    image: mariadb:11.4
    container_name: nac-mariadb
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=nac_elearning_secret
      - MYSQL_DATABASE=nac_elearning
      - MYSQL_USER=nac_user
      - MYSQL_PASSWORD=nac_elearning_secret
    volumes:
      - mariadb-data-dev:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mariadb -h 127.0.0.1 -u $${MYSQL_USER} -p$${MYSQL_PASSWORD} -e 'SELECT 1;' $${MYSQL_DATABASE} || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s
    networks:
      - nac-network

  # ---------------------------------------------
  # 1. Laravel 12 Backend API
  # ---------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: nac-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/var/www/html
      - backend-vendor:/var/www/html/vendor
    environment:
      - APP_NAME=NAC-ELEARNING
      - APP_ENV=local
      - APP_DEBUG=true
      - APP_URL=http://localhost:8000
      - FRONTEND_URL=http://localhost:5173
      - DB_CONNECTION=mariadb
      - DB_HOST=mariadb
      - DB_PORT=3306
      - DB_DATABASE=nac_elearning
      - DB_USERNAME=nac_user
      - DB_PASSWORD=nac_elearning_secret
      - QUEUE_CONNECTION=database
    depends_on:
      mariadb:
        condition: service_healthy
    networks:
      - nac-network

  # ---------------------------------------------
  # 2. Laravel Queue Worker (Email OTP & Async)
  # ---------------------------------------------
  queue:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: nac-queue-worker
    restart: unless-stopped
    command: ["php", "artisan", "queue:listen", "--tries=2", "--backoff=1800"]
    volumes:
      - ./backend:/var/www/html
      - backend-vendor:/var/www/html/vendor
    environment:
      - APP_NAME=NAC-ELEARNING
      - APP_ENV=local
      - APP_DEBUG=true
      - APP_URL=http://localhost:8000
      - FRONTEND_URL=http://localhost:5173
      - DB_CONNECTION=mariadb
      - DB_HOST=mariadb
      - DB_PORT=3306
      - DB_DATABASE=nac_elearning
      - DB_USERNAME=nac_user
      - DB_PASSWORD=nac_elearning_secret
      - QUEUE_CONNECTION=database
    depends_on:
      backend:
        condition: service_started
      mariadb:
        condition: service_healthy
    networks:
      - nac-network

  # ---------------------------------------------
  # 3. React 19 + Vite Frontend (Dev Server)
  # ---------------------------------------------
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    container_name: nac-frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    volumes:
      - ./src:/app/src
      - ./public:/app/public
      - ./index.html:/app/index.html
      - ./vite.config.js:/app/vite.config.js
      - ./tailwind.config.js:/app/tailwind.config.js
      - ./postcss.config.js:/app/postcss.config.js
      - frontend-node-modules:/app/node_modules
    environment:
      - VITE_API_BASE_URL=http://localhost:8000/api
      - VITE_DEV_MODE=true
    depends_on:
      - backend
    networks:
      - nac-network

# ---------------------------------------------
# Named Volumes & Networks
# ---------------------------------------------
volumes:
  mariadb-data-dev:
  backend-vendor:
  frontend-node-modules:

networks:
  nac-network:
    driver: bridge

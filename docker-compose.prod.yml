services:
  backend:
    image: ghcr.io/mugiaadha/react-elearning/backend:latest
    container_name: nac-backend-prod
    restart: always
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=production
      - APP_DEBUG=false
      - APP_URL=https://elearning.socket-clenicapp.my.id
      - FRONTEND_URL=https://elearning.socket-clenicapp.my.id
      - DB_CONNECTION=sqlite
    volumes:
      - ./backend/database:/var/www/html/database
      - ./backend/storage/app/public:/var/www/html/storage/app/public
    networks:
      - nac-network

  queue:
    image: ghcr.io/mugiaadha/react-elearning/backend:latest
    container_name: nac-queue-prod
    restart: always
    command: ["php", "artisan", "queue:work", "--tries=3"]
    environment:
      - APP_ENV=production
      - APP_DEBUG=false
      - DB_CONNECTION=sqlite
    volumes:
      - ./backend/database:/var/www/html/database
      - ./backend/storage/app/public:/var/www/html/storage/app/public
    depends_on:
      - backend
    networks:
      - nac-network

  frontend:
    image: ghcr.io/mugiaadha/react-elearning/frontend:latest
    container_name: nac-frontend-prod
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro
    depends_on:
      - backend
    networks:
      - nac-network

  certbot:
    image: certbot/certbot
    container_name: nac-certbot-prod
    restart: unless-stopped
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot; sleep 12h & wait $${!}; done;'"
    networks:
      - nac-network

networks:
  nac-network:
    driver: bridge

; -------------------------------------------------------------
; Anti-php2shell & PHP Security Hardening (NAC E-Learning)
; -------------------------------------------------------------

; 1. Disable dangerous functions commonly abused by webshells to execute OS commands
disable_functions = exec,passthru,shell_exec,system,popen,show_source

; 2. Strictly disable Remote File Inclusion (RFI)
allow_url_include = Off
allow_url_fopen = On

; 3. Hide PHP version header
expose_php = Off

; 4. Session Security
session.cookie_httponly = 1
session.use_strict_mode = 1

; 5. Execution & Upload limits
max_execution_time = 60
max_input_time = 60
memory_limit = 256M
file_uploads = On
upload_max_filesize = 40M
post_max_size = 45M
max_file_uploads = 5

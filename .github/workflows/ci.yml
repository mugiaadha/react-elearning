name: CI/CD Pipeline

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

env:
  APP_DOMAIN: ${{ vars.APP_DOMAIN || 'nac.socket-clenicapp.my.id' }}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  # ========================================================
  # 1. FRONTEND JOB: Linting, Typecheck & Production Build
  # ========================================================
  frontend:
    name: Frontend (React 19 & Vite)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Linter (oxlint)
        run: npm run lint

      - name: Build Frontend Application
        run: npm run build
        env:
          VITE_API_BASE_URL: https://${{ env.APP_DOMAIN }}/api
          VITE_GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          VITE_MIDTRANS_CLIENT_KEY: ${{ secrets.MIDTRANS_CLIENT_KEY }}
          VITE_DEV_MODE: 'false'

      - name: Check Build Artifacts
        run: |
          test -d dist || { echo "dist directory missing!"; exit 1; }
          test -f dist/index.html || { echo "index.html missing!"; exit 1; }
          echo "Frontend build successfully generated in dist/"

  # ========================================================
  # 2. BACKEND JOB: PHP 8.2, SQLite & PHPUnit Security Tests
  # ========================================================
  backend:
    name: Backend (Laravel 12 & PHP 8.2)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup PHP Environment
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, xml, ctype, iconv, intl, pdo, sqlite3, pdo_sqlite, pdo_mysql, bcmath, zip, pcntl
          coverage: none

      - name: Cache Composer Dependencies
        uses: actions/cache@v4
        with:
          path: backend/vendor
          key: ${{ runner.os }}-composer-${{ hashFiles('backend/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Install Composer Dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Setup Environment File
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Run PHPUnit Test Suite (Including Anti-Webshell & Security Tests)
        run: php vendor/bin/phpunit --testdox

  # ========================================================
  # 3. DOCKER BUILD & PUSH TO GHCR
  # ========================================================
  docker:
    name: Build & Push Images to GHCR
    runs-on: ubuntu-latest
    needs: [frontend, backend]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare GHCR Image Names (Lowercase)
        run: |
          REPO_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          echo "IMAGE_BACKEND=ghcr.io/${REPO_LOWER}/backend" >> $GITHUB_ENV
          echo "IMAGE_FRONTEND=ghcr.io/${REPO_LOWER}/frontend" >> $GITHUB_ENV

      - name: Validate Docker Compose Configuration (Development)
        run: docker compose -f docker-compose.yml config

      - name: Validate Docker Compose Configuration (Production)
        run: |
          cp .env.example .env
          cp backend/.env.example backend/.env
          docker compose -f docker-compose.prod.yml config

      - name: Build & Push Backend Docker Image to GHCR
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ env.IMAGE_BACKEND }}:latest
            ${{ env.IMAGE_BACKEND }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & Push Frontend Docker Image to GHCR (Production Multi-stage)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          target: production
          build-args: |
            VITE_API_BASE_URL=https://${{ env.APP_DOMAIN }}/api
            VITE_GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }}
            VITE_MIDTRANS_CLIENT_KEY=${{ secrets.MIDTRANS_CLIENT_KEY }}
            VITE_DEV_MODE=false
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ env.IMAGE_FRONTEND }}:latest
            ${{ env.IMAGE_FRONTEND }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ========================================================
  # 4. DEPLOY JOB: SSH to VPS & Pull pre-built GHCR Images
  # ========================================================
  deploy:
    name: Deploy to Server via SSH
    runs-on: ubuntu-latest
    needs: [docker]
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy via SSH Remote Command
        uses: appleboy/ssh-action@v1.0.3
        if: env.DEPLOY_HOST != ''
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN || secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ secrets.GHCR_USER || github.actor }}
          SECRET_APP_KEY: ${{ secrets.APP_KEY }}
          SECRET_MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
          SECRET_MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
          SECRET_GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          SECRET_GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          SECRET_MIDTRANS_SERVER_KEY: ${{ secrets.MIDTRANS_SERVER_KEY }}
          SECRET_MIDTRANS_CLIENT_KEY: ${{ secrets.MIDTRANS_CLIENT_KEY }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          command_timeout: 30m
          envs: GHCR_TOKEN,GHCR_USER,SECRET_APP_KEY,SECRET_MAIL_USERNAME,SECRET_MAIL_PASSWORD,SECRET_GOOGLE_CLIENT_ID,SECRET_GOOGLE_CLIENT_SECRET,SECRET_MIDTRANS_SERVER_KEY,SECRET_MIDTRANS_CLIENT_KEY
          script: |
            set -e
            echo "🚀 Starting Daily Deployment on $(hostname)..."
            cd ${{ secrets.DEPLOY_PATH || '/var/www/elearning' }}
            
            # 1. Tarik kode dan file konfigurasi terbaru dari git
            echo "📥 Fetching latest repository updates..."
            git fetch --all
            git checkout -f main
            git reset --hard origin/main
            
            # 2. Sinkronisasi kredensial dari GitHub Actions Secrets ke .env dan backend/.env
            echo "🔐 Syncing secrets from GitHub Actions into .env..."
            if [ -f .env ]; then
              [ -n "$SECRET_GOOGLE_CLIENT_ID" ] && sed -i "s|^VITE_GOOGLE_CLIENT_ID=.*|VITE_GOOGLE_CLIENT_ID=${SECRET_GOOGLE_CLIENT_ID}|" .env
              [ -n "$SECRET_MIDTRANS_CLIENT_KEY" ] && sed -i "s|^VITE_MIDTRANS_CLIENT_KEY=.*|VITE_MIDTRANS_CLIENT_KEY=${SECRET_MIDTRANS_CLIENT_KEY}|" .env
            fi
            if [ -f backend/.env ]; then
              [ -n "$SECRET_APP_KEY" ] && sed -i "s|^APP_KEY=.*|APP_KEY=${SECRET_APP_KEY}|" backend/.env
              [ -n "$SECRET_MAIL_USERNAME" ] && sed -i "s|^MAIL_USERNAME=.*|MAIL_USERNAME=${SECRET_MAIL_USERNAME}|" backend/.env
              [ -n "$SECRET_MAIL_PASSWORD" ] && sed -i "s|^MAIL_PASSWORD=.*|MAIL_PASSWORD=\"${SECRET_MAIL_PASSWORD}\"|" backend/.env
              [ -n "$SECRET_GOOGLE_CLIENT_ID" ] && sed -i "s|^GOOGLE_CLIENT_ID=.*|GOOGLE_CLIENT_ID=${SECRET_GOOGLE_CLIENT_ID}|" backend/.env
              [ -n "$SECRET_GOOGLE_CLIENT_SECRET" ] && sed -i "s|^GOOGLE_CLIENT_SECRET=.*|GOOGLE_CLIENT_SECRET=${SECRET_GOOGLE_CLIENT_SECRET}|" backend/.env
              [ -n "$SECRET_MIDTRANS_SERVER_KEY" ] && sed -i "s|^MIDTRANS_SERVER_KEY=.*|MIDTRANS_SERVER_KEY=${SECRET_MIDTRANS_SERVER_KEY}|" backend/.env
              [ -n "$SECRET_MIDTRANS_CLIENT_KEY" ] && sed -i "s|^MIDTRANS_CLIENT_KEY=.*|MIDTRANS_CLIENT_KEY=${SECRET_MIDTRANS_CLIENT_KEY}|" backend/.env
            fi
            
            # 3. Login ke GitHub Container Registry di VPS
            if [ -n "$GHCR_TOKEN" ]; then
              echo "🔑 Logging in to GitHub Container Registry..."
              echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            fi
            
            # 4. Tarik pre-built image terbaru dari GHCR
            echo "🐳 Pulling pre-built images from GHCR..."
            docker compose -f docker-compose.prod.yml pull
            
            # 5. Jalankan/update container stack dengan image baru
            echo "🚀 Updating running containers..."
            docker compose -f docker-compose.prod.yml up -d --remove-orphans
            
            # 6. Tunggu container backend siap sebelum exec (mencegah error OCI runtime setns)
            for i in $(seq 1 15); do
              if docker compose -f docker-compose.prod.yml exec -T backend php -v >/dev/null 2>&1; then
                break
              fi
              sleep 2
            done

            # 7. Jalankan migrasi database baru (jika ada) & refresh cache Laravel
            echo "🗄️ Running database migrations & refreshing Laravel caches..."
            docker compose -f docker-compose.prod.yml exec -T backend php artisan migrate --force
            docker compose -f docker-compose.prod.yml exec -T backend php artisan config:clear || true
            docker compose -f docker-compose.prod.yml exec -T backend php artisan route:clear || true
            docker compose -f docker-compose.prod.yml exec -T backend php artisan view:clear || true
            docker compose -f docker-compose.prod.yml exec -T backend php artisan config:cache
            docker compose -f docker-compose.prod.yml exec -T backend php artisan route:cache
            docker compose -f docker-compose.prod.yml exec -T backend php artisan view:cache
            
            echo "✅ Daily deployment successful!"

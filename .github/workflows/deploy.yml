name: Production Deployment (CD)

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_run:
    workflows: ["CI/CD Pipeline"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target Environments'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - staging

jobs:
  deploy:
    name: Deploy to Server via SSH
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'push' ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy via SSH Remote Command
        uses: appleboy/ssh-action@v1.0.3
        if: env.DEPLOY_HOST != ''
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN || secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ secrets.GHCR_USER || github.actor }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          command_timeout: 30m
          envs: GHCR_TOKEN,GHCR_USER
          script: |
            set -e
            echo "🚀 Starting Deployment on $(hostname)..."
            cd ${{ secrets.DEPLOY_PATH || '/var/www/elearning' }}
            
            # 1. Tarik file konfigurasi terbaru dari git (docker-compose.prod.yml, nginx, dll)
            echo "📥 Fetching latest configuration files..."
            git fetch --all
            git checkout main
            git pull origin main
            
            # 2. Otomatisasi inisialisasi .env dari .env.example jika belum ada
            if [ ! -f .env ]; then
              echo "📄 Initializing root .env from .env.example..."
              cp .env.example .env
            fi

            if [ ! -f backend/.env ]; then
              echo "📄 Initializing backend/.env from backend/.env.example..."
              cp backend/.env.example backend/.env
            fi

            # 3. Pastikan direktori database & storage di host siap dengan permission yang benar
            mkdir -p backend/database backend/storage/app/public
            touch backend/database/database.sqlite
            chmod -R 777 backend/database backend/storage 2>/dev/null || true

            # 4. Login ke GitHub Container Registry di VPS jika image bersifat privat
            if [ -n "$GHCR_TOKEN" ]; then
              echo "🔑 Logging in to GitHub Container Registry..."
              echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            fi
            
            # 5. Tarik pre-built image dari GHCR (tidak ada kompilasi di VPS)
            echo "🐳 Pulling pre-built images from GHCR..."
            docker compose -f docker-compose.prod.yml pull
            
            # 6. Restart container stack secara instan dengan image baru
            echo "🚀 Launching containers with new images..."
            docker compose -f docker-compose.prod.yml up -d --remove-orphans
            
            # 7. Tunggu sejenak agar backend container siap
            echo "⏳ Waiting for backend container..."
            sleep 5
            
            # 8. Pastikan APP_KEY terisi otomatis jika belum ada di backend/.env
            docker compose -f docker-compose.prod.yml exec -T backend php artisan key:generate --force
            
            # 9. Jalankan migrasi database TERLEBIH DAHULU agar seluruh tabel (users, cache, dll) terbuat
            echo "🗄️ Running database migrations..."
            docker compose -f docker-compose.prod.yml exec -T backend php artisan migrate --force
            
            # 10. Bersihkan dan buat cache Laravel (aman tanpa error 'no such table: cache')
            echo "🧹 Optimizing Laravel configuration and routes..."
            docker compose -f docker-compose.prod.yml exec -T backend php artisan config:clear || true
            docker compose -f docker-compose.prod.yml exec -T backend php artisan route:clear || true
            docker compose -f docker-compose.prod.yml exec -T backend php artisan view:clear || true
            docker compose -f docker-compose.prod.yml exec -T backend php artisan config:cache
            docker compose -f docker-compose.prod.yml exec -T backend php artisan route:cache
            docker compose -f docker-compose.prod.yml exec -T backend php artisan view:cache
            
            echo "✅ Deployment successful"

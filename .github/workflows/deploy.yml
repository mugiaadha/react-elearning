name: CI/CD Pipeline

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

env:
  APP_DOMAIN: ${{ vars.APP_DOMAIN || 'nac.socket-clenicapp.my.id' }}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  # ========================================================
  # 1. FRONTEND JOB: Linting, Typecheck & Production Build
  # ========================================================
  frontend:
    name: Frontend (React 19 & Vite)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Linter (oxlint)
        run: npm run lint

      - name: Build Frontend Application
        run: npm run build
        env:
          VITE_API_BASE_URL: https://${{ env.APP_DOMAIN }}/api
          VITE_GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          VITE_MIDTRANS_CLIENT_KEY: ${{ secrets.MIDTRANS_CLIENT_KEY }}
          VITE_DEV_MODE: 'true'

      - name: Check Build Artifacts
        run: |
          test -d dist || { echo "dist directory missing!"; exit 1; }
          test -f dist/index.html || { echo "index.html missing!"; exit 1; }
          echo "Frontend build successfully generated in dist/"

  # ========================================================
  # 2. BACKEND JOB: PHP 8.2, SQLite & PHPUnit Security Tests
  # ========================================================
  backend:
    name: Backend (Laravel 12 & PHP 8.2)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup PHP Environment
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, xml, ctype, iconv, intl, pdo, sqlite3, pdo_sqlite, pdo_mysql, bcmath, zip, pcntl
          coverage: none

      - name: Cache Composer Dependencies
        uses: actions/cache@v4
        with:
          path: backend/vendor
          key: ${{ runner.os }}-composer-${{ hashFiles('backend/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Install Composer Dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Setup Environment File
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Run PHPUnit Test Suite (Including Anti-Webshell & Security Tests)
        run: php vendor/bin/phpunit --testdox

  # ========================================================
  # 3. DOCKER BUILD & PUSH TO GHCR
  # ========================================================
  docker:
    name: Build & Push Images to GHCR
    runs-on: ubuntu-latest
    needs: [frontend, backend]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare GHCR Image Names (Lowercase)
        run: |
          REPO_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          echo "IMAGE_BACKEND=ghcr.io/${REPO_LOWER}/backend" >> $GITHUB_ENV
          echo "IMAGE_FRONTEND=ghcr.io/${REPO_LOWER}/frontend" >> $GITHUB_ENV

      - name: Validate Docker Compose Configuration (Development)
        run: docker compose -f docker-compose.yml config

      - name: Validate Docker Compose Configuration (Production)
        run: |
          cp .env.example .env
          cp backend/.env.example backend/.env
          docker compose -f docker-compose.prod.yml config

      - name: Build & Push Backend Docker Image to GHCR
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ env.IMAGE_BACKEND }}:latest
            ${{ env.IMAGE_BACKEND }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & Push Frontend Docker Image to GHCR (Production Multi-stage)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          target: production
          build-args: |
            VITE_API_BASE_URL=https://${{ env.APP_DOMAIN }}/api
            VITE_GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }}
            VITE_MIDTRANS_CLIENT_KEY=${{ secrets.MIDTRANS_CLIENT_KEY }}
            VITE_DEV_MODE=true
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ env.IMAGE_FRONTEND }}:latest
            ${{ env.IMAGE_FRONTEND }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ========================================================
  # 4. DEPLOY JOB: SSH to VPS & Pull pre-built GHCR Images
  # ========================================================
  deploy:
    name: Deploy to Server via SSH
    runs-on: ubuntu-latest
    needs: [docker]
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Pre-flight Wait & Verify SSH Port Reachability
        if: env.DEPLOY_HOST != ''
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT || 22 }}
        run: |
          echo "🔍 Checking SSH reachability on ${DEPLOY_HOST}:${DEPLOY_PORT}..."
          SSH_REACHABLE=false
          for attempt in $(seq 1 12); do
            if nc -zv -w 10 "${DEPLOY_HOST}" "${DEPLOY_PORT}" 2>/dev/null; then
              echo "✅ Port ${DEPLOY_PORT} on ${DEPLOY_HOST} is open and reachable (attempt ${attempt}/12)!"
              SSH_REACHABLE=true
              break
            fi
            echo "⏳ Attempt ${attempt}/12: Port ${DEPLOY_PORT} not reachable yet (VPS might be rebooting or network busy). Retrying in 10s..."
            sleep 10
          done
          if [ "$SSH_REACHABLE" = false ]; then
            echo "::error::Tidak dapat menjangkau ${DEPLOY_HOST}:${DEPLOY_PORT} (dial tcp i/o timeout). Pastikan: (1) VPS sedang menyala/selesai reboot, (2) Secret DEPLOY_HOST & DEPLOY_PORT benar, dan (3) Port SSH (${DEPLOY_PORT}) diizinkan di UFW / Cloud Firewall VPS."
            exit 1
          fi

      - name: Deploy via SSH Remote Command
        uses: appleboy/ssh-action@v1.0.3
        if: env.DEPLOY_HOST != ''
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN || secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ secrets.GHCR_USER || github.actor }}
          TARGET_DOMAIN: ${{ env.APP_DOMAIN }}
          SECRET_APP_KEY: ${{ secrets.APP_KEY }}
          SECRET_MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
          SECRET_MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
          SECRET_GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          SECRET_GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          SECRET_MIDTRANS_SERVER_KEY: ${{ secrets.MIDTRANS_SERVER_KEY }}
          SECRET_MIDTRANS_CLIENT_KEY: ${{ secrets.MIDTRANS_CLIENT_KEY }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          timeout: 90s
          command_timeout: 30m
          envs: GHCR_TOKEN,GHCR_USER,TARGET_DOMAIN,SECRET_APP_KEY,SECRET_MAIL_USERNAME,SECRET_MAIL_PASSWORD,SECRET_GOOGLE_CLIENT_ID,SECRET_GOOGLE_CLIENT_SECRET,SECRET_MIDTRANS_SERVER_KEY,SECRET_MIDTRANS_CLIENT_KEY
          script: |
            set -euo pipefail
            echo "🚀 Starting Daily Deployment on $(hostname)..."
            cd ${{ secrets.DEPLOY_PATH || '/var/www/elearning' }}

            # Helper aman untuk update/insert key=value di file .env (tahan karakter spesial /, &, |, $)
            set_env_var() {
              local file="$1"
              local key="$2"
              local val="$3"
              [ -z "$val" ] && return 0
              if [ ! -f "$file" ]; then
                touch "$file"
              fi
              awk -v k="$key" -v v="$val" '
                BEGIN { found=0 }
                $0 ~ "^"k"=" { print k"="v; found=1; next }
                { print }
                END { if (!found) print k"="v }
              ' "$file" > "${file}.tmp" && mv "${file}.tmp" "$file"
            }

            # 1. Tarik kode dan file konfigurasi terbaru dari git
            echo "📥 Fetching latest repository updates..."
            git fetch --all
            git checkout -f main
            git reset --hard origin/main
            sed -i 's/\r$//' scripts/*.sh backend/docker-entrypoint.sh 2>/dev/null || true
            chmod +x scripts/*.sh backend/docker-entrypoint.sh 2>/dev/null || true

            # 2. Pastikan .env & backend/.env ada dan sinkron dengan GitHub Actions Secrets
            echo "🔐 Syncing secrets from GitHub Actions into .env..."
            [ ! -f .env ] && [ -f .env.example ] && cp .env.example .env
            [ ! -f backend/.env ] && [ -f backend/.env.example ] && cp backend/.env.example backend/.env

            set_env_var ".env" "APP_DOMAIN" "${TARGET_DOMAIN}"
            set_env_var ".env" "VITE_API_BASE_URL" "https://${TARGET_DOMAIN}/api"
            set_env_var ".env" "VITE_GOOGLE_CLIENT_ID" "${SECRET_GOOGLE_CLIENT_ID:-}"
            set_env_var ".env" "VITE_MIDTRANS_CLIENT_KEY" "${SECRET_MIDTRANS_CLIENT_KEY:-}"

            set_env_var "backend/.env" "APP_URL" "https://${TARGET_DOMAIN}"
            set_env_var "backend/.env" "FRONTEND_URL" "https://${TARGET_DOMAIN}"
            set_env_var "backend/.env" "GOOGLE_REDIRECT_URI" "https://${TARGET_DOMAIN}/api/auth/google/callback"
            set_env_var "backend/.env" "MAIL_FROM_ADDRESS" "\"no-reply@${TARGET_DOMAIN}\""
            set_env_var "backend/.env" "APP_KEY" "${SECRET_APP_KEY:-}"
            set_env_var "backend/.env" "MAIL_USERNAME" "${SECRET_MAIL_USERNAME:-}"
            [ -n "${SECRET_MAIL_PASSWORD:-}" ] && set_env_var "backend/.env" "MAIL_PASSWORD" "\"${SECRET_MAIL_PASSWORD}\""
            set_env_var "backend/.env" "GOOGLE_CLIENT_ID" "${SECRET_GOOGLE_CLIENT_ID:-}"
            set_env_var "backend/.env" "GOOGLE_CLIENT_SECRET" "${SECRET_GOOGLE_CLIENT_SECRET:-}"
            set_env_var "backend/.env" "MIDTRANS_SERVER_KEY" "${SECRET_MIDTRANS_SERVER_KEY:-}"
            set_env_var "backend/.env" "MIDTRANS_CLIENT_KEY" "${SECRET_MIDTRANS_CLIENT_KEY:-}"
            export APP_DOMAIN="${TARGET_DOMAIN}"

            # 3. Pastikan ./certbot/ssl memiliki file sertifikat agar container frontend (Nginx) tidak pernah crash saat restart
            mkdir -p certbot/ssl certbot/conf certbot/www backend/storage/app/public
            chmod -R 777 backend/storage 2>/dev/null || true
            if [ -f "certbot/conf/live/${TARGET_DOMAIN}/fullchain.pem" ]; then
              cp -fL "certbot/conf/live/${TARGET_DOMAIN}/fullchain.pem" certbot/ssl/fullchain.pem
              cp -fL "certbot/conf/live/${TARGET_DOMAIN}/privkey.pem" certbot/ssl/privkey.pem
            elif [ ! -s "certbot/ssl/fullchain.pem" ] || [ ! -s "certbot/ssl/privkey.pem" ]; then
              openssl req -x509 -nodes -newkey rsa:2048 -days 90 \
                -keyout certbot/ssl/privkey.pem \
                -out certbot/ssl/fullchain.pem \
                -subj "/CN=${TARGET_DOMAIN}" 2>/dev/null || true
            fi

            # 4. Login ke GitHub Container Registry di VPS
            if [ -n "${GHCR_TOKEN:-}" ]; then
              echo "🔑 Logging in to GitHub Container Registry..."
              echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            fi

            # 5. Tarik pre-built image terbaru dari GHCR (dengan retry resilience)
            echo "🐳 Pulling pre-built images from GHCR..."
            for attempt in 1 2 3; do
              if docker compose -f docker-compose.prod.yml pull; then
                break
              fi
              echo "  -> Pull image gagal (percobaan $attempt/3), mencoba ulang dalam 5 detik..."
              sleep 5
            done

            # 6. Jalankan/update container stack dengan image baru
            echo "🚀 Updating running containers..."
            docker compose -f docker-compose.prod.yml up -d --remove-orphans

            # 7. Tunggu container backend selesai menjalankan entrypoint & aktif di port 8000 (mencegah bentrok exec)
            echo "⏳ Waiting for backend server to be ready on port 8000..."
            BACKEND_READY=false
            for i in $(seq 1 45); do
              if curl -fsS -o /dev/null http://127.0.0.1:8000/api/brevets 2>/dev/null; then
                BACKEND_READY=true
                break
              fi
              sleep 2
            done

            if [ "$BACKEND_READY" = false ]; then
              echo "⚠️ Backend belum merespons setelah 90 detik. Menampilkan log diagnostik container:"
              docker compose -f docker-compose.prod.yml ps || true
              docker compose -f docker-compose.prod.yml logs --tail=50 backend mariadb || true
              exit 1
            fi

            # 8. Refresh cache Laravel & bersihkan image Docker usang agar disk VPS tidak penuh
            echo "🧹 Refreshing Laravel caches & pruning dangling Docker images..."
            docker compose -f docker-compose.prod.yml exec -T backend php artisan config:clear || true
            docker compose -f docker-compose.prod.yml exec -T backend php artisan route:clear || true
            docker compose -f docker-compose.prod.yml exec -T backend php artisan view:clear || true
            docker compose -f docker-compose.prod.yml exec -T backend php artisan config:cache || true
            docker compose -f docker-compose.prod.yml exec -T backend php artisan route:cache || true
            docker compose -f docker-compose.prod.yml exec -T backend php artisan view:cache || true
            docker image prune -f >/dev/null 2>&1 || true

            echo "✅ Daily deployment successful!"

name: First-Time VPS Provisioning & SSL Setup

on:
  workflow_dispatch:
    inputs:
      domain:
        description: "Production Domain (sudah dipointing A-Record ke IP VPS)"
        required: true
        default: "elearning.socket-clenicapp.my.id"
      ssl_email:
        description: "Email untuk notifikasi SSL Let's Encrypt Certbot"
        required: false
        default: "admin@socket-clenicapp.my.id"

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  # ========================================================
  # 1. BUILD & PUSH DOCKER IMAGES TO GHCR
  # ========================================================
  docker:
    name: Build & Push Images to GHCR
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare Lowercase Names
        run: |
          REPO_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          echo "IMAGE_BACKEND=ghcr.io/${REPO_LOWER}/backend" >> $GITHUB_ENV
          echo "IMAGE_FRONTEND=ghcr.io/${REPO_LOWER}/frontend" >> $GITHUB_ENV

      - name: Build & Push Backend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_BACKEND }}:latest
            ${{ env.IMAGE_BACKEND }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & Push Frontend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          target: production
          build-args: |
            VITE_API_BASE_URL=https://${{ inputs.domain }}/api
          push: true
          tags: |
            ${{ env.IMAGE_FRONTEND }}:latest
            ${{ env.IMAGE_FRONTEND }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ========================================================
  # 2. COMPLETE PROVISIONING & SSL SETUP VIA SSH
  # ========================================================
  provision:
    name: Provision VPS, Deploy & Install SSL
    runs-on: ubuntu-latest
    needs: [docker]

    steps:
      - name: Execute Full Setup via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN || secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ secrets.GHCR_USER || github.actor }}
          TARGET_DOMAIN: ${{ inputs.domain }}
          TARGET_EMAIL: ${{ inputs.ssl_email }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          command_timeout: 45m
          envs: GHCR_TOKEN,GHCR_USER,TARGET_DOMAIN,TARGET_EMAIL
          script: |
            set -e
            echo "=========================================================="
            echo "🚀 Memulai Setup Lengkap VPS Baru untuk https://${TARGET_DOMAIN}"
            echo "=========================================================="

            SUDO=""
            if [ "$EUID" -ne 0 ]; then
              SUDO="sudo"
            fi

            # 1. Update apt & install dependencies dasar
            echo "[1/8] Memperbarui package repository OS & install git, curl..."
            $SUDO apt-get update -y
            $SUDO apt-get install -y git curl ca-certificates gnupg ufw

            # 2. Install Docker jika belum terpasang di VPS
            if ! command -v docker &> /dev/null; then
              echo "[2/8] Docker belum terpasang. Memasang Docker Engine resmi..."
              curl -fsSL https://get.docker.com | $SUDO sh
              $SUDO systemctl enable --now docker
              $SUDO usermod -aG docker $(whoami) 2>/dev/null || true
            else
              echo "[2/8] Docker sudah terpasang: $(docker --version)"
            fi

            # 3. Siapkan direktori deployment dan clone repo
            DEPLOY_DIR="${{ secrets.DEPLOY_PATH || '/var/www/elearning' }}"
            echo "[3/8] Menyiapkan direktori deployment di $DEPLOY_DIR..."
            $SUDO mkdir -p "$DEPLOY_DIR"
            $SUDO chown -R $(whoami):$(whoami) "$DEPLOY_DIR" 2>/dev/null || true
            cd "$DEPLOY_DIR"

            if [ ! -d ".git" ]; then
              echo "  -> Melakukan clone repository ke $DEPLOY_DIR..."
              git clone "https://github.com/${{ github.repository }}.git" .
            else
              echo "  -> Repository sudah ada, mengambil pembaruan terbaru..."
              git fetch --all
              git checkout main
              git pull origin main
            fi

            # 4. Inisialisasi file .env dengan setting production
            echo "[4/8] Menginisialisasi environment variables..."
            if [ ! -f .env ]; then
              cp .env.example .env
            fi
            
            # Kunci port Docker frontend ke 127.0.0.1:8080 agar port 80/443 dipakai Host Nginx
            if grep -q "FRONTEND_PORT=" .env; then
              sed -i 's/^FRONTEND_PORT=.*/FRONTEND_PORT=127.0.0.1:8080/' .env
            else
              echo "FRONTEND_PORT=127.0.0.1:8080" >> .env
            fi

            if [ ! -f backend/.env ]; then
              cp backend/.env.example backend/.env
            fi

            # 5. Siapkan database SQLite dan storage permissions
            echo "[5/8] Menyiapkan database SQLite & folder storage..."
            mkdir -p backend/database backend/storage/app/public
            touch backend/database/database.sqlite
            chmod -R 777 backend/database backend/storage 2>/dev/null || true

            # 6. Tarik Docker Images dari GHCR & Jalankan Stack
            echo "[6/8] Menjalankan Docker Stack dari GHCR..."
            if [ -n "$GHCR_TOKEN" ]; then
              echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            fi
            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml up -d --remove-orphans
            sleep 5

            # Setup Laravel APP_KEY & Migrasi Database
            docker compose -f docker-compose.prod.yml exec -T backend php artisan key:generate --force
            docker compose -f docker-compose.prod.yml exec -T backend php artisan migrate --force
            docker compose -f docker-compose.prod.yml exec -T backend php artisan config:clear || true
            docker compose -f docker-compose.prod.yml exec -T backend php artisan route:clear || true
            docker compose -f docker-compose.prod.yml exec -T backend php artisan view:clear || true
            docker compose -f docker-compose.prod.yml exec -T backend php artisan config:cache
            docker compose -f docker-compose.prod.yml exec -T backend php artisan route:cache
            docker compose -f docker-compose.prod.yml exec -T backend php artisan view:cache

            # 7. Eksekusi Host Nginx & Let's Encrypt SSL Otomatis
            echo "[7/8] Menginstal Host Nginx & Menerbitkan Sertifikat SSL Let's Encrypt..."
            chmod +x scripts/setup-ssl.sh
            $SUDO bash scripts/setup-ssl.sh "${TARGET_EMAIL}" "${TARGET_DOMAIN}"

            # 8. Verifikasi Status Akhir
            echo "[8/8] Memverifikasi status layanan..."
            docker compose -f docker-compose.prod.yml ps
            $SUDO systemctl status nginx --no-pager || true

            echo "=========================================================="
            echo "🎉 SETUP VPS BARU BERHASIL 100%!"
            echo "🌐 Website Anda sudah LIVE & HTTPS aktif di:"
            echo "   https://${TARGET_DOMAIN}"
            echo "=========================================================="


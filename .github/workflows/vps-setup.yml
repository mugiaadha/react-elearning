name: First-Time VPS Provisioning & SSL Setup

on:
  workflow_dispatch:
    inputs:
      domain:
        description: "Production Domain (opsional, jika dikosongkan akan memakai vars.APP_DOMAIN)"
        required: false
        default: ""
      ssl_email:
        description: "Email untuk notifikasi SSL Let's Encrypt Certbot"
        required: false
        default: ""

env:
  APP_DOMAIN: ${{ inputs.domain || vars.APP_DOMAIN || 'nac.socket-clenicapp.my.id' }}
  SSL_EMAIL: ${{ inputs.ssl_email || vars.SSL_EMAIL || 'admin@socket-clenicapp.my.id' }}

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  # ========================================================
  # 1. BUILD & PUSH DOCKER IMAGES TO GHCR
  # ========================================================
  docker:
    name: Build & Push Images to GHCR
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare Lowercase Names
        run: |
          REPO_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          echo "IMAGE_BACKEND=ghcr.io/${REPO_LOWER}/backend" >> $GITHUB_ENV
          echo "IMAGE_FRONTEND=ghcr.io/${REPO_LOWER}/frontend" >> $GITHUB_ENV

      - name: Build & Push Backend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_BACKEND }}:latest
            ${{ env.IMAGE_BACKEND }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & Push Frontend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          target: production
          build-args: |
            VITE_API_BASE_URL=https://${{ env.APP_DOMAIN }}/api
            VITE_GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }}
            VITE_MIDTRANS_CLIENT_KEY=${{ secrets.MIDTRANS_CLIENT_KEY }}
            VITE_DEV_MODE=true
          push: true
          tags: |
            ${{ env.IMAGE_FRONTEND }}:latest
            ${{ env.IMAGE_FRONTEND }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ========================================================
  # 2. COMPLETE PROVISIONING & PURE DOCKER SSL SETUP VIA SSH
  # ========================================================
  provision:
    name: Provision VPS, Deploy & Install Pure Docker SSL
    runs-on: ubuntu-latest
    needs: [docker]

    steps:
      - name: Pre-flight Wait & Verify SSH Port Reachability
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT || 22 }}
        run: |
          echo "🔍 Checking SSH reachability on ${DEPLOY_HOST}:${DEPLOY_PORT}..."
          SSH_REACHABLE=false
          for attempt in $(seq 1 12); do
            if nc -zv -w 10 "${DEPLOY_HOST}" "${DEPLOY_PORT}" 2>/dev/null; then
              echo "✅ Port ${DEPLOY_PORT} on ${DEPLOY_HOST} is open and reachable (attempt ${attempt}/12)!"
              SSH_REACHABLE=true
              break
            fi
            echo "⏳ Attempt ${attempt}/12: Port ${DEPLOY_PORT} not reachable yet (VPS might be rebooting or network busy). Retrying in 10s..."
            sleep 10
          done
          if [ "$SSH_REACHABLE" = false ]; then
            echo "::error::Tidak dapat menjangkau ${DEPLOY_HOST}:${DEPLOY_PORT} (dial tcp i/o timeout). Pastikan: (1) VPS sedang menyala/selesai reboot, (2) Secret DEPLOY_HOST & DEPLOY_PORT benar, dan (3) Port SSH (${DEPLOY_PORT}) diizinkan di UFW / Cloud Firewall VPS."
            exit 1
          fi

      - name: Execute Full Setup via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN || secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ secrets.GHCR_USER || github.actor }}
          TARGET_DOMAIN: ${{ env.APP_DOMAIN }}
          TARGET_EMAIL: ${{ env.SSL_EMAIL }}
          SECRET_APP_KEY: ${{ secrets.APP_KEY }}
          SECRET_MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
          SECRET_MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
          SECRET_GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          SECRET_GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          SECRET_MIDTRANS_SERVER_KEY: ${{ secrets.MIDTRANS_SERVER_KEY }}
          SECRET_MIDTRANS_CLIENT_KEY: ${{ secrets.MIDTRANS_CLIENT_KEY }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          timeout: 90s
          command_timeout: 45m
          envs: GHCR_TOKEN,GHCR_USER,TARGET_DOMAIN,TARGET_EMAIL,SECRET_APP_KEY,SECRET_MAIL_USERNAME,SECRET_MAIL_PASSWORD,SECRET_GOOGLE_CLIENT_ID,SECRET_GOOGLE_CLIENT_SECRET,SECRET_MIDTRANS_SERVER_KEY,SECRET_MIDTRANS_CLIENT_KEY
          script: |
            set -euo pipefail
            echo "=========================================================="
            echo "🚀 Memulai Setup Lengkap VPS Baru (Pure Docker Stack)"
            echo "🌐 Domain: https://${TARGET_DOMAIN}"
            echo "=========================================================="

            export DEBIAN_FRONTEND=noninteractive
            SUDO=""
            if [ "${EUID:-$(id -u)}" -ne 0 ]; then
              SUDO="sudo"
            fi

            # Helper aman untuk update/insert key=value di file .env (tahan karakter spesial /, &, |, $)
            set_env_var() {
              local file="$1"
              local key="$2"
              local val="$3"
              [ -z "$val" ] && return 0
              if [ ! -f "$file" ]; then
                touch "$file"
              fi
              awk -v k="$key" -v v="$val" '
                BEGIN { found=0 }
                $0 ~ "^"k"=" { print k"="v; found=1; next }
                { print }
                END { if (!found) print k"="v }
              ' "$file" > "${file}.tmp" && mv "${file}.tmp" "$file"
            }

            # 1. Update apt, install dependencies dasar & pastikan Swap Memory 2GB aktif (mencegah OOM exit 137)
            echo "[1/8] Memperbarui package repository OS, install git, curl & mengaktifkan Swap 2GB..."
            if [ ! -f /swapfile ] && [ "$(swapon --show | wc -l)" -eq 0 ]; then
              $SUDO fallocate -l 2G /swapfile 2>/dev/null || $SUDO dd if=/dev/zero of=/swapfile bs=1M count=2048
              $SUDO chmod 600 /swapfile
              $SUDO mkswap /swapfile
              $SUDO swapon /swapfile
              if ! grep -q "/swapfile" /etc/fstab; then
                echo "/swapfile none swap sw 0 0" | $SUDO tee -a /etc/fstab >/dev/null
              fi
              echo "  -> Swap memory 2GB berhasil diaktifkan!"
            fi
            $SUDO apt-get update -y || true
            $SUDO apt-get install -y -o Dpkg::Options::="--force-confdef" -o Dpkg::Options::="--force-confold" git curl ca-certificates gnupg openssl

            # 2. Matikan web server host jika ada & buka firewall port 80/443 jika ufw aktif
            if command -v systemctl &> /dev/null; then
              $SUDO systemctl stop nginx apache2 httpd 2>/dev/null || true
              $SUDO systemctl disable nginx apache2 httpd 2>/dev/null || true
            fi
            if command -v ufw &> /dev/null; then
              $SUDO ufw allow "${{ secrets.DEPLOY_PORT || 22 }}/tcp" 2>/dev/null || true
              $SUDO ufw allow OpenSSH 2>/dev/null || true
              $SUDO ufw allow 80/tcp 2>/dev/null || true
              $SUDO ufw allow 443/tcp 2>/dev/null || true
            fi

            # 3. Install Docker jika belum terpasang di VPS
            if ! command -v docker &> /dev/null; then
              echo "[2/8] Docker belum terpasang. Memasang Docker Engine resmi..."
              curl -fsSL https://get.docker.com | $SUDO sh
              $SUDO systemctl enable --now docker
              $SUDO usermod -aG docker $(whoami) 2>/dev/null || true
            else
              echo "[2/8] Docker sudah terpasang: $(docker --version)"
              $SUDO systemctl start docker 2>/dev/null || true
            fi

            # 4. Siapkan direktori deployment dan clone repo
            DEPLOY_DIR="${{ secrets.DEPLOY_PATH || '/var/www/elearning' }}"
            echo "[3/8] Menyiapkan direktori deployment di $DEPLOY_DIR..."
            $SUDO mkdir -p "$DEPLOY_DIR"
            $SUDO chown -R $(whoami):$(whoami) "$DEPLOY_DIR" 2>/dev/null || true
            cd "$DEPLOY_DIR"

            if [ ! -d ".git" ]; then
              echo "  -> Melakukan clone repository ke $DEPLOY_DIR..."
              rm -rf "$DEPLOY_DIR"/* "$DEPLOY_DIR"/.[!.]* 2>/dev/null || true
              git clone "https://github.com/${{ github.repository }}.git" .
            else
              echo "  -> Repository sudah ada, mengambil pembaruan terbaru..."
              git fetch --all
              git checkout -f main
              git reset --hard origin/main
            fi

            # Pastikan seluruh script .sh menggunakan line-ending LF dan executable
            sed -i 's/\r$//' scripts/*.sh backend/docker-entrypoint.sh 2>/dev/null || true
            chmod +x scripts/*.sh backend/docker-entrypoint.sh 2>/dev/null || true

            # 5. Inisialisasi & sinkronisasi domain + GitHub Secrets pada file .env dan backend/.env
            echo "[4/8] Menginisialisasi environment variables & secrets untuk domain ${TARGET_DOMAIN}..."
            if [ ! -f .env ]; then
              cp .env.example .env
            fi
            set_env_var ".env" "APP_DOMAIN" "${TARGET_DOMAIN}"
            set_env_var ".env" "VITE_API_BASE_URL" "https://${TARGET_DOMAIN}/api"
            set_env_var ".env" "VITE_GOOGLE_CLIENT_ID" "${SECRET_GOOGLE_CLIENT_ID:-}"
            set_env_var ".env" "VITE_MIDTRANS_CLIENT_KEY" "${SECRET_MIDTRANS_CLIENT_KEY:-}"

            if [ ! -f backend/.env ]; then
              cp backend/.env.example backend/.env
            fi
            set_env_var "backend/.env" "APP_URL" "https://${TARGET_DOMAIN}"
            set_env_var "backend/.env" "FRONTEND_URL" "https://${TARGET_DOMAIN}"
            set_env_var "backend/.env" "GOOGLE_REDIRECT_URI" "https://${TARGET_DOMAIN}/api/auth/google/callback"
            set_env_var "backend/.env" "MAIL_FROM_ADDRESS" "\"no-reply@${TARGET_DOMAIN}\""
            set_env_var "backend/.env" "APP_KEY" "${SECRET_APP_KEY:-}"
            set_env_var "backend/.env" "MAIL_USERNAME" "${SECRET_MAIL_USERNAME:-}"
            [ -n "${SECRET_MAIL_PASSWORD:-}" ] && set_env_var "backend/.env" "MAIL_PASSWORD" "\"${SECRET_MAIL_PASSWORD}\""
            set_env_var "backend/.env" "GOOGLE_CLIENT_ID" "${SECRET_GOOGLE_CLIENT_ID:-}"
            set_env_var "backend/.env" "GOOGLE_CLIENT_SECRET" "${SECRET_GOOGLE_CLIENT_SECRET:-}"
            set_env_var "backend/.env" "MIDTRANS_SERVER_KEY" "${SECRET_MIDTRANS_SERVER_KEY:-}"
            set_env_var "backend/.env" "MIDTRANS_CLIENT_KEY" "${SECRET_MIDTRANS_CLIENT_KEY:-}"
            export APP_DOMAIN="${TARGET_DOMAIN}"

            # 6. Siapkan folder storage permissions
            echo "[5/8] Menyiapkan folder storage..."
            mkdir -p backend/storage/app/public backend/storage/framework/cache backend/storage/framework/sessions backend/storage/framework/views backend/storage/logs
            chmod -R 777 backend/storage 2>/dev/null || true

            # 7. Tarik Docker Images dari GHCR (dengan retry jika koneksi jaringan sempat putus)
            echo "[6/8] Menarik Docker Images dari GHCR..."
            if [ -n "${GHCR_TOKEN:-}" ]; then
              echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            fi
            for attempt in 1 2 3; do
              if docker compose -f docker-compose.prod.yml pull; then
                break
              fi
              echo "  -> Gagal pull image (percobaan $attempt/3), mencoba lagi dalam 5 detik..."
              sleep 5
            done

            # 8. Eksekusi Pure Docker SSL Setup & Jalankan Stack
            echo "[7/8] Mengonfigurasi Let's Encrypt SSL & menyalakan Docker Stack..."
            bash scripts/setup-ssl.sh "${TARGET_EMAIL}" "${TARGET_DOMAIN}"

            # Tunggu hingga docker-entrypoint.sh pada container backend selesai melakukan migrasi & seeding otomatis,
            # serta server PHP artisan serve sudah aktif mendengarkan di port 8000 (mencegah bentrok & OOM exit 137)
            echo "🗄️ Menunggu container Backend selesai inisialisasi database & menyala di port 8000..."
            BACKEND_READY=false
            for i in $(seq 1 60); do
              if curl -fsS -o /dev/null http://127.0.0.1:8000/api/brevets 2>/dev/null; then
                echo "  -> ✅ Backend API & Database sudah siap 100%!"
                BACKEND_READY=true
                break
              fi
              echo "  -> Menunggu Backend selesai migrasi/seeding ($i/60)..."
              sleep 2
            done

            if [ "$BACKEND_READY" = false ]; then
              echo "⚠️ Backend belum merespons setelah 120 detik. Menampilkan log diagnostik container:"
              docker compose -f docker-compose.prod.yml ps || true
              docker compose -f docker-compose.prod.yml logs --tail=50 backend mariadb || true
              exit 1
            fi

            echo "🧹 Menyegarkan cache konfigurasi, rute, dan view Laravel..."
            docker compose -f docker-compose.prod.yml exec -T backend php artisan config:clear || true
            docker compose -f docker-compose.prod.yml exec -T backend php artisan route:clear || true
            docker compose -f docker-compose.prod.yml exec -T backend php artisan view:clear || true
            docker compose -f docker-compose.prod.yml exec -T backend php artisan config:cache || true
            docker compose -f docker-compose.prod.yml exec -T backend php artisan route:cache || true
            docker compose -f docker-compose.prod.yml exec -T backend php artisan view:cache || true

            # 9. Verifikasi Status Akhir (pastikan juga Nginx HTTPS merespons)
            echo "[8/8] Memverifikasi status container Docker & endpoint HTTPS..."
            docker compose -f docker-compose.prod.yml ps
            curl -ksS -o /dev/null "https://127.0.0.1/api/brevets" -H "Host: ${TARGET_DOMAIN}" && echo "✅ Endpoint HTTPS Proxy (/api/brevets) terverifikasi OK!" || true

            echo "=========================================================="
            echo "🎉 SETUP VPS BARU BERHASIL 100%!"
            echo "🌐 Website Anda sudah LIVE & HTTPS aktif di:"
            echo "   https://${TARGET_DOMAIN}"
            echo "🔒 Semua layanan berjalan murni di Docker tanpa Nginx host!"
            echo "=========================================================="
